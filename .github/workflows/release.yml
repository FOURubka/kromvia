name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build client mod
        working-directory: client
        shell: bash
        run: ./gradlew bundle --no-daemon

      - name: Release notes
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## / {p = ($2 == v); next} p' CHANGELOG.md > notes.md || true
          { echo 'NOTES<<KROMVIA_NOTES'; cat notes.md; echo 'KROMVIA_NOTES'; } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          KROMVIA_MS_CLIENT_ID: d65a5497-172f-400f-9846-d55ad2ee8062
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kromvia ${{ github.ref_name }}
          releaseBody: ${{ env.NOTES }}
          releaseDraft: true
          uploadUpdaterJson: true
          tauriScript: bun run tauri

  sign-windows:
    name: Sign Windows installer
    needs: release
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Download unsigned installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir unsigned
          gh release download "$GITHUB_REF_NAME" -p "*_x64-setup.exe" -p "latest.json" -D unsigned
          ls unsigned

      - id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: unsigned/*_x64-setup.exe
          if-no-files-found: error

      - uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Re-sign for the updater and replace release files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          exe=$(ls signed/*_x64-setup.exe)
          bun run tauri signer sign "$exe"
          sig=$(cat "$exe.sig")
          jq --arg sig "$sig" '.platforms |= with_entries(if (.key | startswith("windows-")) then .value.signature = $sig else . end)' unsigned/latest.json > latest.json
          gh release upload "$GITHUB_REF_NAME" "$exe" "$exe.sig" latest.json --clobber
