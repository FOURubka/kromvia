[package]
name = "kromvia"
version = "0.1.15"
description = "Kromvia Minecraft launcher"
authors = ["_4rubka_"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kromvia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.0", features = ["rt", "macros", "process", "time", "fs", "io-util", "sync", "net"] }
futures-util = "0.3.34"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
flate2 = "1.1.10"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "multipart"] }
md-5 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ed25519-dalek = "2"
getrandom = "0.3"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
png = "0.18.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media", "Media_Control", "Foundation", "Storage_Streams"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
